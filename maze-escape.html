<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>迷宮逃脫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0e0f13;--panel:#16181e;--panel2:#1c1f27;--line:#2c2f38;--text:#ece6d8;--muted:#a9a293;--soft:#d9d2c2;
  --amber:#f2b544;--danger:#ff6b5e;--ok:#8fe8a8;--safe:#5fd0ff;--monster:#ff4d4d;
  --serif:"Noto Serif TC",serif;--sans:"Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{cursor:default;opacity:.45}
/* 遊戲畫面禁止選取文字,避免手機長按選字後卡住 */
#play,#play *,.overlay .btns,.overlay .btns *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#play input,.overlay input{-webkit-user-select:text;user-select:text}
.board,.board canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mhud,.mmsg{display:none}
.mhud{align-items:center;gap:10px;width:min(540px,100%)}
.mh-lvl{font-family:var(--serif);font-weight:900;font-size:22px;color:var(--amber)}
.mh-name{font-weight:700;font-size:15px;flex-grow:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-time{font-family:var(--serif);font-weight:900;font-size:24px;color:var(--amber);font-variant-numeric:tabular-nums}
.mh-key{width:34px;height:34px;border-radius:50%;background:#262932;color:#6b6f7a;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mh-key.have{background:#3a2d0c;color:var(--amber)}
.mh-menu{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px}
.mmsg{width:min(540px,100%);padding:7px 12px;border-radius:8px;background:var(--panel);color:var(--muted);font-size:14px;min-height:34px}
.mmsg.hot{background:#2a2210;color:#f5d58a}
.mmsg.safe{background:#0d2632;color:#9fe3ff}
.mh-fs{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.mh-fs .ic-exit,body.fs .mh-fs .ic-enter{display:none}
.mh-fs .ic-off,body.muted .mh-fs .ic-on{display:none}
body.muted .mh-fs .ic-off{display:block}
body.fs .mh-fs .ic-exit{display:block}
/* ---- 全螢幕模式 ---- */
body.fs{overflow:hidden;overscroll-behavior:none}
body.fs #play .play{position:fixed;inset:0;z-index:5;background:var(--bg);max-width:none;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 12px)}
body.fs .right{display:none}
body.fs .left{--bw:min(calc(100vw - 24px),calc(100vh - 262px),760px);width:100%;height:100%;align-items:center;justify-content:center;gap:8px}
@supports (height:100dvh){body.fs .left{--bw:min(calc(100vw - 24px),calc(100dvh - 262px),760px)}}
body.fs .mhud{display:flex;width:var(--bw)}
body.fs .mmsg{display:block;width:var(--bw)}
body.fs .board{width:var(--bw);height:var(--bw);aspect-ratio:auto}
body.fs .ctrl{width:var(--bw)}
body.fs .dpad{grid-template-columns:repeat(3,58px)}
body.fs .dpad button{height:58px;border-radius:10px}
@media (orientation:landscape){
  body.fs .left{display:grid;grid-template-columns:auto auto 170px;grid-template-rows:auto 1fr;grid-template-areas:"hud hud msg" "dpad board inv";align-content:center;justify-content:center;column-gap:20px;row-gap:8px;
    --bw:min(calc(100vh - 90px),calc(100vw - 460px),900px)}
  @supports (height:100dvh){body.fs .left{--bw:min(calc(100dvh - 90px),calc(100vw - 460px),900px)}}
  body.fs .mhud{grid-area:hud;width:100%}
  body.fs .mmsg{grid-area:msg;width:100%;align-self:center;font-size:13px;padding:6px 10px;line-height:1.35}
  body.fs .board{grid-area:board}
  body.fs .ctrl{display:contents}
  body.fs .dpad{grid-area:dpad;align-self:center}
  body.fs .inv{grid-area:inv;grid-template-columns:1fr;align-self:center}
  body.fs .ibtn{height:50px}
}
.wrap{max-width:1280px;margin:0 auto;padding:32px 40px}
.eyebrow{font-size:13px;letter-spacing:.3em;color:var(--amber);font-weight:700}
h1{margin:0;font-family:var(--serif);font-weight:900;font-size:48px;line-height:1.1}
.sub{margin:0;font-size:15px;color:var(--muted)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--panel)}
.chip.gold{border-color:#5a4a22;background:#221c0e;color:var(--amber)}
label.chip{display:flex;gap:8px;align-items:center;cursor:pointer}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:22px}
.legend .box{display:flex;flex-direction:column;gap:10px}
.legend h3{margin:0;font-family:var(--serif);font-weight:600;font-size:16px}
.lg-row{display:flex;flex-wrap:wrap;gap:8px 16px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.lg svg{flex-shrink:0}
.lg small{color:var(--muted);font-size:12px}
.tier{margin-bottom:16px}
.tier-h{display:flex;gap:12px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
.tier-h b{font-family:var(--serif);font-weight:600;font-size:17px}
.tier-h span{font-size:13px;color:var(--muted)}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.card{position:relative;min-height:104px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px}
.card:hover{border-color:#4a4d58}
.card .n{font-family:var(--serif);font-weight:900;font-size:26px;color:var(--amber);line-height:1}
.card .t{font-size:16px;font-weight:700}
.card .s{font-size:12px;color:var(--muted)}
.card .m{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .done{position:absolute;top:12px;right:12px;font-size:12px;padding:2px 8px;border-radius:999px;background:#1f3a28;color:#9be3b0}
.play{display:flex;gap:40px;padding:28px 40px;max-width:1280px;margin:0 auto}
.left{width:540px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.board{position:relative;width:540px;height:540px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#07080b}
.board.danger{border-color:#7a2b24}
.board canvas{display:block;width:100%;height:100%}
.fx{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.fx span{padding:3px 10px;border-radius:999px;font-size:13px;font-weight:500;background:rgba(14,15,19,.88)}
.fx .lives{margin-left:auto;color:#ff8fa0}
.ctrl{display:flex;gap:16px;align-items:flex-start}
.dpad{display:grid;grid-template-columns:repeat(3,44px);gap:6px;flex-shrink:0}
.dpad button{height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.inv{flex-grow:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ibtn{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);text-align:left;font-size:14px}
.ibtn .nm{flex-grow:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn .ct{font-variant-numeric:tabular-nums;font-weight:700}
.ibtn kbd{font-family:var(--sans);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.hex{width:26px;height:28px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:14px;color:#17130a;flex-shrink:0}
.right{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.lvl{font-size:13px;letter-spacing:.25em;color:var(--amber);font-weight:700}
h2{margin:0;font-family:var(--serif);font-weight:900;font-size:34px;line-height:1.15}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:4px 10px;border-radius:6px;background:var(--panel2);font-size:13px;color:var(--soft)}
.tag.mud{background:#2a2114;color:#e5c38e}
.tag.safe{background:#0d2632;color:#9fe3ff}
.tag.trap{background:#2a2622;color:#d6cbbb}
.row{display:flex;gap:14px}
.box{padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.timer{flex-grow:1;display:flex;flex-direction:column;gap:10px}
.timer .top{display:flex;justify-content:space-between;align-items:baseline}
.timer .lab{font-size:14px;color:var(--muted)}
.timer .val{font-family:var(--serif);font-weight:900;font-size:38px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:#262932;overflow:hidden}
.bar i{display:block;height:8px;background:var(--amber);border-radius:4px;width:100%}
.obj{width:240px;display:flex;gap:12px;align-items:center}
.keyic{width:44px;height:44px;border-radius:50%;background:#262932;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#6b6f7a}
.keyic.have{background:#3a2d0c;color:var(--amber)}
.obj .lab{font-size:13px;color:var(--muted)}
.obj .val{font-size:16px;font-weight:700}
#compass{flex-shrink:0;color:var(--amber);display:none}
.msg{padding:10px 16px;border-radius:10px;background:var(--panel);color:var(--muted);font-size:15px;font-weight:500;min-height:44px}
.msg.hot{background:#2a2210;color:#f5d58a}
.msg.safe{background:#0d2632;color:#9fe3ff}
.roster-h{display:flex;justify-content:space-between;align-items:baseline}
.roster-h b{font-family:var(--serif);font-weight:600;font-size:18px}
.roster-h span{font-size:13px;color:var(--muted)}
.roster{display:flex;flex-direction:column;gap:8px;flex-grow:1}
.mon{display:flex;gap:12px;align-items:center;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.glyph{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:19px;flex-shrink:0;box-shadow:0 0 0 3px var(--monster)}
.mon .nm{font-size:15px;font-weight:700}
.mon .ai{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid #3a3d48;color:var(--soft)}
.mon .ds{font-size:13px;color:var(--muted);line-height:1.45}
.mon .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.counter{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--soft)}
.counter .hex{width:18px;height:20px;font-size:11px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{height:46px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;font-weight:500}
.btn.gold{border-color:#5a4a22;background:#221c0e;color:var(--amber);font-weight:700}
.btn.solid{border:none;background:var(--amber);color:#1a1406;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(6,7,10,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.show{display:flex}
.result{width:460px;max-width:100%;padding:36px 36px 30px;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.result h2{font-size:40px}
.result p{margin:0}
.hidden{display:none!important}
.tip{padding:10px 14px;border-radius:10px;background:#1b1a14;border:1px solid #3a3320;color:#e9dcb4;font-size:14px;line-height:1.55}
.tip b{color:var(--amber);margin-right:6px}
.lb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;margin-bottom:22px}
.lb h3{margin:0;font-family:var(--serif);font-weight:600;font-size:16px}
.lb .box{display:flex;flex-direction:column;gap:10px}
.lb-status{font-size:14px;color:var(--soft);line-height:1.6}
.lb-status.warn{color:#f5d58a}
.namerow{display:flex;gap:8px}
.namerow input,.rname input{flex-grow:1;min-width:0;height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#0f1116;color:var(--text);font-size:15px;font-family:inherit}
.namerow input:focus,.rname input:focus{outline:2px solid var(--amber);outline-offset:1px}
.lb-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lb select{height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#0f1116;color:var(--text);font-size:14px;font-family:inherit}
.lb table{width:100%;border-collapse:collapse;font-size:14px}
.lb th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.lb td{padding:7px 8px;border-bottom:1px solid #1f222a;font-variant-numeric:tabular-nums}
.lb td.rk{width:44px;font-family:var(--serif);font-weight:900;color:var(--amber)}
.lb td.tm{text-align:right;width:90px}
.lb tr.me td{background:#221c0e}
.lb .empty{color:var(--muted);font-size:14px;padding:12px 8px}
.rboard{font-size:14px;color:var(--soft);line-height:1.6}
.rboard b{color:var(--amber)}
.rname{display:flex;gap:8px;width:100%}
@media (max-width:1100px){.lb{grid-template-columns:1fr}}
@media (max-width:1100px){
  .mhud{display:flex}
  .mmsg{display:block}
  .play{flex-direction:column;padding:12px 16px;gap:16px}
  .left{width:100%;align-items:center;gap:8px}
  .board{width:min(540px,100%);height:auto;aspect-ratio:1}
  .grid5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wrap{padding:24px 16px}
  h1{font-size:36px}
  .legend{grid-template-columns:1fr}
  .right .lvl,.right h2,.right .tags,.right .row,.right .msg{display:none}
  .ctrl{width:min(540px,100%)}
  .dpad{grid-template-columns:repeat(3,54px)}
  .dpad button{height:54px;border-radius:10px}
  .inv{grid-template-columns:1fr 1fr}
  .ibtn{height:54px;padding:0 10px;justify-content:center;gap:8px}
  .ibtn .nm,.ibtn kbd{display:none}
  .ibtn .ct{font-size:16px}
}
@media (max-width:560px){
  .grid5{gap:10px}
  .card{min-height:96px;padding:10px 12px}
  .chips{gap:6px}
  .chip{padding:6px 10px;font-size:13px}
  .mh-name{display:none}
  .mhud{gap:6px}
  .mh-menu{padding:0 8px}
  .mh-fs{width:32px}
}
@media (max-width:360px){
  #mSafe{display:none}
}
</style>
</head>
<body>

<section id="menu" class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">LANTERN MAZE</div>
      <h1>迷宮逃脫</h1>
      <p class="sub">提著燈籠走進黑暗:找到鑰匙、打開大門,在怪物追上你之前逃出去。</p>
    </div>
    <div class="chips">
      <span class="chip">限時 5 分鐘起,每 5 關 +3 分鐘</span>
      <span class="chip">視野只有 2 格</span>
      <span class="chip">每 5 關怪物 +1</span>
      <span class="chip">第 6 關起有道具</span>
      <span class="chip">第 11 關起有陷阱</span>
      <span class="chip">第 25 關起鑰匙藏在密室</span>
      <label class="chip"><input type="checkbox" id="compassToggle"> 顯示羅盤(簡單模式)</label>
      <label class="chip"><input type="checkbox" id="fsToggle"> 開始時自動全螢幕</label>
      <label class="chip"><input type="checkbox" id="musicToggle"> 背景音樂</label>
      <label class="chip"><input type="checkbox" id="sfxToggle"> 音效</label>
      <span class="chip gold" id="clearedChip">已通關 0 / 25</span>
    </div>
  </div>

  <div class="legend">
    <div class="box">
      <h3>地圖圖例</h3>
      <div class="lg-row">
        <span class="lg"><svg width="30" height="30" viewBox="0 0 60 60"><rect x="2" y="2" width="56" height="56" rx="10" fill="rgba(95,208,255,0.25)" stroke="#5fd0ff" stroke-width="4"/><path d="M30 15l13 6v10c0 9-6 14-13 17c-7-3-13-8-13-17V21z" fill="none" stroke="#5fd0ff" stroke-width="4" stroke-linejoin="round"/></svg>安全區 <small>方形・盾牌</small></span>
        <span class="lg"><svg width="30" height="30" viewBox="0 0 60 60"><circle cx="30" cy="30" r="21" fill="#9aa3ad"/><circle cx="30" cy="30" r="25" fill="none" stroke="#ff4d4d" stroke-width="5"/></svg>怪物 <small>圓形・紅圈</small></span>
        <span class="lg"><svg width="30" height="30" viewBox="0 0 60 60"><path d="M30 6l21 12v24L30 54L9 42V18z" fill="#ffd35c" stroke="#fff" stroke-width="4"/></svg>道具 <small>六角形</small></span>
        <span class="lg"><svg width="30" height="30" viewBox="0 0 60 60"><circle cx="30" cy="30" r="20" fill="rgba(0,0,0,0.45)" stroke="#8a8378" stroke-width="3"/><path d="M14 26l5-7 5 7 6-7 6 7 5-7 5 7M14 34l5 7 5-7 6 7 6-7 5 7 5-7" fill="none" stroke="#d6cbbb" stroke-width="3" stroke-linejoin="round"/></svg>陷阱 <small>困住 3 秒</small></span>
        <span class="lg"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f2b544" stroke-width="2.2" stroke-linecap="round"><circle cx="7.5" cy="12" r="4"/><path d="M11.5 12H21M18 12v3.5M21 12v2.5"/></svg>鑰匙</span>
        <span class="lg"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="2" stroke-linecap="round"><rect x="5" y="2.5" width="14" height="19" rx="1.5"/><circle cx="15.5" cy="12" r="1.2"/></svg>大門</span>
      </div>
    </div>
    <div class="box">
      <h3>道具(依本關怪物配置)</h3>
      <div class="lg-row" id="itemLegend"></div>
    </div>
  </div>
  <div class="lb" id="leaderboard">
    <div class="box">
      <h3>玩家</h3>
      <div class="lb-status" id="lbStatus">正在連線排行榜…</div>
      <form class="namerow" id="nameForm">
        <label for="nickInput" class="hidden">玩家名稱</label>
        <input id="nickInput" maxlength="12" placeholder="輸入你的名稱(最多 12 字)" autocomplete="nickname">
        <button class="btn gold" type="submit" id="nickSave">儲存名稱</button>
      </form>
    </div>
    <div class="box">
      <div class="lb-head">
        <h3>排行榜</h3>
        <label for="lbSelect" class="hidden">排行榜類型</label>
        <select id="lbSelect"></select>
      </div>
      <div id="lbTable"></div>
    </div>
  </div>
  <div id="tiers"></div>
</section>

<section id="play" class="hidden">
  <div class="play">
    <div class="left">
      <div class="mhud">
        <span class="mh-lvl" id="mLvl">01</span>

  '噬光者會吃掉安全區,需要躲的時候要趁早用。',
  '從這關開始鑰匙藏在小密室裡,密室只有一個入口,進去前先確認身後沒有怪物。',
  '影分身每 20 秒召喚分身,分身 10 秒後就消失,先躲一下再繼續走。',
  '重力魔 5 格內會拖慢你,保持距離,或用傳送卷軸脫身。',
  '回溯者會把你拉回 5 秒前的位置,拿到鑰匙後盡快遠離它。',
  '冰霜巨人貼近時會凍住你 1.5 秒,護盾可以擋下冰凍。',

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function lineup(n) {
  const c = 1 + Math.floor((n - 1) / 5);
  const out = [];
  for (let i = 0; i < c; i++) out.push(n - 1 - i);
  return out;
}
function safeCount(n) { return 2 + Math.ceil(n / 3); }
function trapCount(n) { return n >= TRAP_FROM ? Math.min(12, 2 + Math.floor((n - 10) * 0.6)) : 0; }
function sizeOf(n) { return { W: 13 + 2 * (n - 1), H: 11 + 2 * (n - 1) }; }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmt(sec) { const s = Math.max(0, Math.ceil(sec)); return Math.floor(s / 60) + ':' + pad2(s % 60); }
function hexHTML(t, cls) { const it = ITEMS[t]; return '<span class="hex' + (cls ? ' ' + cls : '') + '" style="background:' + it.color + '">' + it.glyph + '</span>'; }

function bfs(g, W, H, sx, sy) {
  const d = new Int16Array(W * H).fill(-1);
  const q = new Int32Array(W * H);
  let h = 0, t = 0;
  const s = sy * W + sx;
  d[s] = 0; q[t++] = s;
  while (h < t) {
    const c = q[h++];
    const x = c % W, y = (c - x) / W;
    for (let k = 0; k < 4; k++) {
      const nx = x + DIRS[k][0], ny = y + DIRS[k][1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const ni = ny * W + nx;
      if (d[ni] !== -1 || g[ni] !== 0) continue;
      d[ni] = d[c] + 1; q[t++] = ni;
    }
  }
  return d;
}

// 最遠點取樣:讓東西盡量分散,也遠離 anchors
function spread(W, pool, count, anchors, r) {
  pool = pool.slice();
  const out = [];
  while (out.length < count && pool.length) {
    let bi = -1, bs = -1;
    for (let t = 0; t < pool.length; t++) {
      const x = pool[t] % W, y = Math.floor(pool[t] / W);
      let md = 1e9;
      for (const a of anchors) md = Math.min(md, Math.abs(a.x - x) + Math.abs(a.y - y));
      for (const a of out) md = Math.min(md, Math.abs(a.x - x) + Math.abs(a.y - y));
      const sc = md + r() * 3;
      if (sc > bs) { bs = sc; bi = t; }
    }
    const i = pool.splice(bi, 1)[0];
    out.push({ x: i % W, y: Math.floor(i / W) });
  }
  return out;
}

function buildLevel(n) {
  const T = THEMES[n - 1];
  const { W, H } = sizeOf(n);
  const r = rng(n * 7919 + 17);
  const g = new Uint8Array(W * H).fill(1);
  const I = (x, y) => y * W + x;
  const inner = (x, y) => x > 0 && y > 0 && x < W - 1 && y < H - 1;
  const algo = T[1];
  if (algo === 'dfs' || algo === 'grow') {
    const stack = [[1, 1]]; g[I(1, 1)] = 0;
    while (stack.length) {
      const k = algo === 'dfs' || r() < 0.5 ? stack.length - 1 : Math.floor(r() * stack.length);
      const [x, y] = stack[k];
      const nb = [];
      for (const [dx, dy] of DIRS) { const nx = x + dx * 2, ny = y + dy * 2; if (inner(nx, ny) && g[I(nx, ny)] === 1) nb.push([nx, ny, dx, dy]); }
      if (!nb.length) { stack.splice(k, 1); continue; }
      const [nx, ny, dx, dy] = nb[Math.floor(r() * nb.length)];
      g[I(x + dx, y + dy)] = 0; g[I(nx, ny)] = 0; stack.push([nx, ny]);
    }
  } else if (algo === 'prim') {
    g[I(1, 1)] = 0;
    const front = [];
    const addF = (x, y) => { for (const [dx, dy] of DIRS) { const nx = x + dx * 2, ny = y + dy * 2; if (inner(nx, ny) && g[I(nx, ny)] === 1) front.push([nx, ny, x + dx, y + dy]); } };
    addF(1, 1);
    while (front.length) {
      const i = Math.floor(r() * front.length);
      const f = front[i]; front[i] = front[front.length - 1]; front.pop();
      if (g[I(f[0], f[1])] === 0) continue;
      g[I(f[0], f[1])] = 0; g[I(f[2], f[3])] = 0; addF(f[0], f[1]);
    }
  } else {
    const parent = new Int32Array(W * H);
    for (let i = 0; i < parent.length; i++) parent[i] = i;
    const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const edges = [];
    for (let y = 1; y < H - 1; y += 2) for (let x = 1; x < W - 1; x += 2) {
      g[I(x, y)] = 0;
      if (x + 2 < W - 1) edges.push([x, y, x + 2, y]);
      if (y + 2 < H - 1) edges.push([x, y, x, y + 2]);
    }
    for (let i = edges.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const tmp = edges[i]; edges[i] = edges[j]; edges[j] = tmp; }
    for (const [ax, ay, bx, by] of edges) {
      const a = find(I(ax, ay)), b = find(I(bx, by));
      if (a !== b) { parent[a] = b; g[I((ax + bx) / 2, (ay + by) / 2)] = 0; }
    }
  }
  // 房間
  for (let k = 0; k < T[3]; k++) {
    const rw = r() < 0.5 ? 3 : 5, rh = r() < 0.5 ? 3 : 5;
    const mx = Math.floor((W - 1 - rw) / 2), my = Math.floor((H - 1 - rh) / 2);
    const rx = 1 + 2 * Math.floor(r() * mx), ry = 1 + 2 * Math.floor(r() * my);
    for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) g[I(x, y)] = 0;
  }
  // 迴路:打通部分死路
  if (T[2] > 0) {
    for (let y = 1; y < H - 1; y += 2) for (let x = 1; x < W - 1; x += 2) {
      let open = 0;
      for (const [dx, dy] of DIRS) if (g[I(x + dx, y + dy)] === 0) open++;
      if (open === 1 && r() < T[2]) {
        const opts = DIRS.filter(([dx, dy]) => g[I(x + dx, y + dy)] === 1 && inner(x + dx * 2, y + dy * 2));
        if (opts.length) { const [dx, dy] = opts[Math.floor(r() * opts.length)]; g[I(x + dx, y + dy)] = 0; }
      }
    }
  }
  // 小密室(第 25 關起):5×5 圍牆包住 3×3 房間,只有一個入口,鑰匙藏在其中一間
  const vaults = [];
  const protect = new Set();
  const vaultFloor = new Set();
  if (n >= VAULT_FROM) {
    const want = n === VAULT_FROM ? 2 : 3;
    const cands = [];
    for (let y = 3; y <= H - 4; y += 2) for (let x = 3; x <= W - 4; x += 2) if (x + y > 14) cands.push({ x, y });
    for (let k = 0; k < want; k++) {
      let best = null, bs = -1;
      for (const c of cands) {
        if (vaults.some(v => Math.max(Math.abs(v.x - c.x), Math.abs(v.y - c.y)) < 7)) continue;
        let md = Math.abs(c.x - 1) + Math.abs(c.y - 1);
        for (const v of vaults) md = Math.min(md, Math.abs(v.x - c.x) + Math.abs(v.y - c.y));
        const sc = md + r() * 8;
        if (sc > bs) { bs = sc; best = c; }
      }
      if (!best) break;
      vaults.push(best);
    }
    for (const v of vaults) {
      for (let y = v.y - 2; y <= v.y + 2; y++) for (let x = v.x - 2; x <= v.x + 2; x++) {
        const edge = Math.abs(x - v.x) === 2 || Math.abs(y - v.y) === 2;
        g[I(x, y)] = edge ? 1 : 0;
        protect.add(I(x, y));
        if (!edge) vaultFloor.add(I(x, y));
      }
      // 入口朝向起點那一側(偶爾換邊)
      const sides = DIRS.filter(([dx, dy]) => inner(v.x + dx * 3, v.y + dy * 3));
      sides.sort((a, b) => (Math.abs(v.x + a[0] * 3 - 1) + Math.abs(v.y + a[1] * 3 - 1)) - (Math.abs(v.x + b[0] * 3 - 1) + Math.abs(v.y + b[1] * 3 - 1)));
      const [dx, dy] = sides[r() < 0.7 ? 0 : Math.min(1, sides.length - 1)];
      g[I(v.x + dx * 2, v.y + dy * 2)] = 0;
      g[I(v.x + dx * 3, v.y + dy * 3)] = 0;
      vaultFloor.add(I(v.x + dx * 2, v.y + dy * 2));
    }
    // 圍牆可能切斷原本的走廊:把被切開的區域重新接回來
    for (let guard = 0; guard < 400; guard++) {
      const dd = bfs(g, W, H, 1, 1);
      let fixed = false;
      for (let i = 0; i < W * H && !fixed; i++) {
        if (g[i] !== 1 || protect.has(i)) continue;
        const x = i % W, y = (i - x) / W;
        if (!inner(x, y)) continue;
        for (const [dx, dy] of [[1, 0], [0, 1]]) {
          const a = I(x - dx, y - dy), b = I(x + dx, y + dy);
          if (g[a] === 0 && g[b] === 0 && ((dd[a] >= 0) !== (dd[b] >= 0))) { g[i] = 0; fixed = true; break; }
        }
      }
      if (!fixed) break;
    }
  }
  const mud = new Uint8Array(W * H);
  if (T[4] > 0) for (let i = 0; i < W * H; i++) if (g[i] === 0 && i !== I(1, 1) && !protect.has(i) && r() < T[4]) mud[i] = 1;
  const ds = bfs(g, W, H, 1, 1);
  const floors = [];
  let maxD = 0;
  for (let i = 0; i < W * H; i++) if (ds[i] > 0) { floors.push(i); if (ds[i] > maxD) maxD = ds[i]; }
  let ki;
  if (vaults.length) {
    let kv = vaults[0];
    for (const v of vaults) if (ds[I(v.x, v.y)] > ds[I(kv.x, kv.y)]) kv = v;
    ki = I(kv.x, kv.y);
    kv.hasKey = true;
  } else {
    const far = floors.filter(i => ds[i] >= maxD * 0.8);
    ki = far[Math.floor(r() * far.length)];
  }
  const key = { x: ki % W, y: Math.floor(ki / W) };
  const dk = bfs(g, W, H, key.x, key.y);
  let best = -1, door = null, doorIn = null;
  for (let x = 1; x < W - 1; x++) for (const y of [0, H - 1]) {
    const iy = y === 0 ? 1 : H - 2; const ii = I(x, iy);
    if (g[ii] !== 0 || ds[ii] < maxD * 0.3) continue;
    const sc = dk[ii] + 0.6 * ds[ii] + r() * 3;
    if (sc > best) { best = sc; door = { x, y }; doorIn = { x, y: iy }; }
  }
  for (let y = 1; y < H - 1; y++) for (const x of [0, W - 1]) {
    const ix = x === 0 ? 1 : W - 2; const ii = I(ix, y);
    if (g[ii] !== 0 || ds[ii] < maxD * 0.3) continue;
    const sc = dk[ii] + 0.6 * ds[ii] + r() * 3;
    if (sc > best) { best = sc; door = { x, y }; doorIn = { x: ix, y }; }
  }
  g[I(door.x, door.y)] = 2;
  const lu = lineup(n);
  let cand = floors.filter(i => ds[i] >= Math.max(8, maxD * 0.45) && i !== ki && !protect.has(i));
  if (cand.length < lu.length) cand = floors.filter(i => ds[i] >= 4);
  const spawns = lu.map(mi => {
    if (MONS[mi].id === 'echo') return { m: mi, x: 1, y: 1 };
    const j = Math.floor(r() * cand.length);
    const ci = cand.splice(j, 1)[0];
    return { m: mi, x: ci % W, y: Math.floor(ci / W) };
  });
  const taken = new Set(spawns.map(s => I(s.x, s.y)));
  taken.add(ki); taken.add(I(doorIn.x, doorIn.y)); taken.add(I(1, 1));
  for (const i of protect) taken.add(i);
  const start = { x: 1, y: 1 };

  // 安全區
  const safes = spread(W, floors.filter(i => ds[i] >= 5 && !taken.has(i)), safeCount(n), [start], r);
  for (const s of safes) taken.add(I(s.x, s.y));

  // 道具:每隻怪物配 2 個(1 個剋制它的 + 1 個隨機)
  const items = [];
  if (n >= ITEM_FROM) {
    const kinds = [];
    for (const mi of lu) { kinds.push(MONS[mi].counter); kinds.push(ITEM_KEYS[Math.floor(r() * ITEM_KEYS.length)]); }
    const pts = spread(W, floors.filter(i => ds[i] >= 3 && !taken.has(i)), kinds.length, [start].concat(safes), r);
    pts.forEach((p, k) => { items.push({ x: p.x, y: p.y, type: kinds[k] }); taken.add(I(p.x, p.y)); });
    // 沒有鑰匙的密室裡放一個道具當作誘餌
    for (const v of vaults) if (!v.hasKey) items.push({ x: v.x, y: v.y, type: ITEM_KEYS[Math.floor(r() * ITEM_KEYS.length)] });
  }

  // 陷阱:放在走廊上
  const traps = [];
  const tc = trapCount(n);
  if (tc) {
    const corr = floors.filter(i => {
      if (ds[i] < 6 || taken.has(i)) return false;
      const x = i % W, y = Math.floor(i / W);
      let o = 0;
      for (const [dx, dy] of DIRS) if (g[I(x + dx, y + dy)] === 0) o++;
      return o === 2;
    });
    for (let k = 0; k < tc && corr.length; k++) {
      const ci = corr.splice(Math.floor(r() * corr.length), 1)[0];
      traps.push(ci);
    }
  }
  return { W, H, grid: g, mud, key, door, doorIn, spawns, safes, items, traps, vaultFloor, theme: T };
}

// ---------------- 音樂與音效(Web Audio 即時合成,不需要音檔) ----------------
// 每 5 關一種曲調:[低音根音 Hz, 每分鐘拍數]
const MUSIC_TIERS = [[55.00, 68], [43.65, 74], [73.42, 80], [69.30, 88], [58.27, 96]];
const MINOR = [0, 2, 3, 5, 7, 8, 10];
const PROG = [[0, 2, 4], [5, 0, 2], [3, 5, 0], [4, 6, 1]]; // i – VI – iv – v
// 怪物靠近時的不協和音程(依最近的怪物而不同)
const DANGER_SETS = [[1, 16 / 15, 45 / 32], [1, 6 / 5, 64 / 45], [1, 9 / 8, 8 / 5], [1, 15 / 16, 4 / 3], [1, 17 / 16, 3 / 2]];

const Sound = {
  ctx: null, musicOn: true, sfxOn: true, muted: false,
  danger: 0, dangerIdx: -1, playing: false,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 4;
    comp.connect(c.destination);
    this.master = c.createGain(); this.master.connect(comp);
    this.musicBus = c.createGain(); this.musicBus.connect(this.master);
    this.dangerBus = c.createGain(); this.dangerBus.gain.value = 0; this.dangerBus.connect(this.master);
    this.sfxBus = c.createGain(); this.sfxBus.connect(this.master);
    // 迴聲,讓音樂盒旋律有地窖的空間感
    this.delay = c.createDelay(1); this.delay.delayTime.value = 0.38;
    const fb = c.createGain(); fb.gain.value = 0.38;
    const dl = c.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 1800;
    this.delay.connect(dl); dl.connect(fb); fb.connect(this.delay); dl.connect(this.musicBus);
    const nb = c.sampleRate;
    this.noiseBuf = c.createBuffer(1, nb, nb);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < nb; i++) d[i] = Math.random() * 2 - 1;
    this.applyVolumes();
    setInterval(() => this.schedule(), 90);
    document.addEventListener('visibilitychange', () => {
      if (!this.ctx) return;
      if (document.hidden) this.ctx.suspend().catch(() => {}); else this.ctx.resume().catch(() => {});
    });
  },

  applyVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.muted ? 0 : 0.9, t, 0.05);
    this.musicBus.gain.setTargetAtTime(this.musicOn ? 0.55 * (1 - 0.45 * this.danger) : 0, t, 0.3);
    this.dangerBus.gain.setTargetAtTime(this.musicOn ? 0.4 * this.danger : 0, t, 0.25);
    this.sfxBus.gain.setTargetAtTime(this.sfxOn ? 0.8 : 0, t, 0.05);
  },

  // ---- 背景音樂 ----
  startMusic(n) {
    if (!this.ctx) return;
    this.stopMusic();
    const c = this.ctx, t = c.currentTime;
    const [root, bpm] = MUSIC_TIERS[Math.min(MUSIC_TIERS.length - 1, Math.floor((n - 1) / 5))];
    this.root = root; this.bpm = bpm;
    this.nextT = t + 0.1; this.stepN = 0; this.hbT = t + 0.1;
    const nodes = [];
    // 低沉持續音
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = 3;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = c.createGain(); lfoG.gain.value = 160;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    const dg = c.createGain(); dg.gain.value = 0; dg.gain.setTargetAtTime(0.2, t, 1.5);
    lp.connect(dg); dg.connect(this.musicBus);
    [[root, 'sawtooth', 0], [root * 1.5, 'sawtooth', 7], [root / 2, 'sine', 0]].forEach(([f, type, det]) => {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
      o.connect(lp); o.start(t); nodes.push(o);
    });
    lfo.start(t); nodes.push(lfo);
    // 危險層:不協和的顫音弦樂,音量由怪物距離決定
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 1.4;
    const trem = c.createGain(); trem.gain.value = 0.5;
    const tl = c.createOscillator(); tl.frequency.value = 7;
    const tlg = c.createGain(); tlg.gain.value = 0.5;
    tl.connect(tlg); tlg.connect(trem.gain);
    bp.connect(trem); trem.connect(this.dangerBus);
    this.dangerOsc = [1, 2, 3].map(() => {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = root * 8;
      const g = c.createGain(); g.gain.value = 0.12;
      o.connect(g); g.connect(bp); o.start(t); nodes.push(o);
      return o;
    });
    tl.start(t); nodes.push(tl);
    this.setDangerVoice(0);
    this.musicNodes = { nodes, dg };
    this.playing = true;
  },

  stopMusic() {
    if (!this.ctx || !this.musicNodes) return;
    const t = this.ctx.currentTime;
    this.musicNodes.dg.gain.setTargetAtTime(0, t, 0.3);
    this.musicNodes.nodes.forEach(o => { try { o.stop(t + 1.5); } catch (e) {} });
    this.musicNodes = null;
    this.playing = false;
    this.setDanger(0, -1);
  },

  setDangerVoice(idx) {
    const set = DANGER_SETS[((idx % DANGER_SETS.length) + DANGER_SETS.length) % DANGER_SETS.length];
    const t = this.ctx.currentTime;
    this.dangerOsc.forEach((o, k) => o.frequency.setTargetAtTime(this.root * 8 * set[k], t, 0.2));
  },

  // x: 0(安全)~1(貼身);idx:最近的怪物編號,決定危險音樂的音色
  setDanger(x, idx) {
    if (!this.ctx) return;
    x = Math.max(0, Math.min(1, x));
    if (Math.abs(x - this.danger) < 0.02 && idx === this.dangerIdx) return;
    this.danger = x;
    if (idx !== this.dangerIdx && idx >= 0 && this.dangerOsc && this.playing) this.setDangerVoice(idx);
    this.dangerIdx = idx;
    this.applyVolumes();
  },

  schedule() {
    const c = this.ctx;
    if (!c || !this.playing || c.state !== 'running') return;
    const ahead = c.currentTime + 0.3;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < ahead) {
      this.musicStep(this.nextT, this.stepN);
      this.nextT += 60 / this.bpm / 2;
      this.stepN++;
    }
    if (this.hbT < c.currentTime) this.hbT = c.currentTime + 0.05;
    while (this.hbT < ahead) {
      if (this.danger > 0.08 && this.musicOn) this.heartbeat(this.hbT, this.danger);
      this.hbT += 60 / (62 + 88 * this.danger);
    }
  },

  noteFreq(deg, oct) {
    const semi = MINOR[((deg % 7) + 7) % 7] + 12 * (oct + Math.floor(deg / 7));
    return this.root * 4 * Math.pow(2, semi / 12);
  },

  musicStep(t, n) {
    const chord = PROG[Math.floor(n / 16) % PROG.length];
    if (n % 16 === 0) this.pluck(this.noteFreq(chord[0], -1), t, 0.22, 2.2, this.musicBus);
    const busy = 0.55 - 0.25 * this.danger;
    if (Math.random() < busy) {
      const deg = chord[Math.floor(Math.random() * 3)];
      this.pluck(this.noteFreq(deg, Math.random() < 0.3 ? 1 : 0), t, 0.1, 1.1, this.musicBus, true);
    }
    if (n % 32 === 24 && Math.random() < 0.6) this.pluck(this.noteFreq(chord[1], 2), t, 0.05, 2.5, this.musicBus, true);
  },

  pluck(f, t, vol, len, bus, echo) {
    const c = this.ctx;
    const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.01;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    const g2 = c.createGain(); g2.gain.value = 0.3;
    o.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(bus);
    if (echo) g.connect(this.delay);
    o.start(t); o2.start(t); o.stop(t + len + 0.05); o2.stop(t + len + 0.05);
  },

  heartbeat(t, x) {
    const vol = 0.25 + 0.55 * x;
    [0, 0.16].forEach((off, k) => {
      const c = this.ctx;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(k ? 70 : 85, t + off);
      o.frequency.exponentialRampToValueAtTime(38, t + off + 0.18);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(vol * (k ? 0.7 : 1), t + off + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.25);
      o.connect(g); g.connect(this.master);
      o.start(t + off); o.stop(t + off + 0.3);
    });
  },

  // ---- 音效 ----
  tone(f, dur, type, vol, when, slideTo) {
    const c = this.ctx, t = c.currentTime + (when || 0);
    const o = c.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfxBus);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, freq, vol, when, type) {
    const c = this.ctx, t = c.currentTime + (when || 0);
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfxBus);
    s.start(t); s.stop(t + dur + 0.05);
  },

  play(name) {
    if (!this.ctx || !this.sfxOn || this.muted) return;
    const T = (f, d, ty, v, w, s) => this.tone(f, d, ty, v, w, s);
    const N = (d, f, v, w, ty) => this.noise(d, f, v, w, ty);
    switch (name) {
      case 'key': [880, 1175, 1568, 2093].forEach((f, i) => T(f, 0.5, 'triangle', 0.25, i * 0.08)); break;
      case 'item': T(660, 0.15, 'square', 0.08); T(990, 0.3, 'square', 0.08, 0.08); break;
      case 'time': T(400, 0.5, 'sine', 0.2, 0, 1600); T(1600, 0.4, 'triangle', 0.12, 0.45); break;
      case 'heart': T(523, 0.25, 'triangle', 0.2); T(784, 0.45, 'triangle', 0.2, 0.12); break;
      case 'lamp': N(0.4, 3000, 0.2, 0, 'bandpass'); T(1320, 0.6, 'sine', 0.15, 0.05); break;
      case 'shield': T(200, 0.45, 'sawtooth', 0.12, 0, 900); T(1200, 0.6, 'sine', 0.1, 0.3); break;
      case 'stun': T(1400, 0.25, 'square', 0.15, 0, 180); N(0.2, 4000, 0.15, 0, 'highpass'); break;
      case 'teleport': T(300, 0.35, 'sine', 0.2, 0, 1800); T(1800, 0.35, 'sine', 0.12, 0.3, 400); break;
      case 'trap': N(0.12, 2500, 0.5); T(130, 0.35, 'square', 0.25, 0, 45); break;
      case 'block': T(900, 0.2, 'triangle', 0.2); N(0.1, 5000, 0.15, 0, 'highpass'); break;
      case 'locked': T(110, 0.18, 'square', 0.15); T(98, 0.2, 'square', 0.15, 0.12); break;
      case 'safe': T(1320, 1.2, 'sine', 0.18); T(1760, 1.2, 'sine', 0.1, 0.1); break;
      case 'expire': T(990, 0.5, 'sine', 0.18, 0, 330); T(660, 0.6, 'sine', 0.12, 0.2, 220); break;
      case 'steal': T(700, 0.12, 'square', 0.12); T(500, 0.12, 'square', 0.12, 0.1); T(350, 0.25, 'square', 0.12, 0.2); break;
      case 'hurt': T(440, 0.3, 'sawtooth', 0.2, 0, 220); T(330, 0.4, 'sawtooth', 0.18, 0.2, 110); break;
      case 'blink': T(600, 0.12, 'square', 0.12, 0, 2400); break;
      case 'roar': N(0.6, 500, 0.4); T(90, 0.6, 'sawtooth', 0.25, 0, 60); break;
      case 'crash': N(0.7, 900, 0.7); T(70, 0.5, 'sine', 0.4, 0, 35); break;
      case 'dark': T(55, 1.8, 'sawtooth', 0.25, 0, 40); N(1.5, 300, 0.25); break;
      case 'spot': T(311, 0.35, 'sawtooth', 0.12); T(330, 0.35, 'sawtooth', 0.12); T(466, 0.3, 'sawtooth', 0.08, 0.05); break;
      case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => T(f, 0.9, 'triangle', 0.22, i * 0.11)); T(262, 1.6, 'sine', 0.2, 0.2); break;
      case 'lose': T(440, 1.2, 'sawtooth', 0.22, 0, 90); T(466, 1.2, 'sawtooth', 0.18, 0, 95); N(0.8, 700, 0.35, 0.05); break;
      case 'click': T(1200, 0.05, 'square', 0.06); break;
    }
  }
};
try {
  Sound.musicOn = localStorage.getItem('maze-music') !== '0';
  Sound.sfxOn = localStorage.getItem('maze-sfx') !== '0';
} catch (e) {}

// ---------------- 遊戲核心 ----------------
const Game = {
  g: null,
  held: [],
  cleared: {},
  compass: false,

  start(n) {
    const L = buildLevel(n);
    const now = Date.now();
    const g = Object.assign({}, L, {
      n, hasKey: false, p: { x: 1, y: 1 }, facing: [1, 0], trail: [{ x: 1, y: 1, t: now }],
      t0: now, lastMove: now, nextMove: now, webs: new Map(), ver: 0, cache: new Map(),
      msg: '找到鑰匙,再前往出口大門!', msgUntil: now + 4000, over: false,
      bonus: 0, lives: 0, lampUntil: 0, invUntil: 0, stuckUntil: 0, darkUntil: 0, trapperCount: 0,
      inv: { lamp: 0, shield: 0, stun: 0, scroll: 0 }
    });
    g.mons = L.spawns.map((s, i) => {
      const M = MONS[s.m];
      return Object.assign({}, M, { type: M.id, x: s.x, y: s.y, px: s.x, py: s.y, next: now + 2500 + i * 400, hidden: M.id === 'echo', stunUntil: 0 });
    });
    g.safes = L.safes.map(s => ({ x: s.x, y: s.y, energy: SAFE_TIME, active: true }));
    g.safeAt = new Map(g.safes.map(z => [z.y * g.W + z.x, z]));
    g.items = new Map(L.items.map(it => [it.y * g.W + it.x, it.type]));
    g.traps = new Set(L.traps);
    g.limit = timeLimit(n);
    g.lastTick = now;
    this.g = g;
    this.held = [];
    this.rebuildMG();
    Sound.init();
    Sound.startMusic(n);
    UI.showPlay(g);
  },

  say(msg, now, sfx) { this.g.msg = msg; this.g.msgUntil = now + 3500; if (sfx) Sound.play(sfx); },

  // 怪物用的地圖:仍有效的安全區視同牆壁
  rebuildMG() {
    const g = this.g;
    g.mg = new Uint8Array(g.grid);
    for (const z of g.safes) if (z.active) g.mg[z.y * g.W + z.x] = 1;
    g.ver++;
    g.cache.clear();
    g.distP = bfs(g.mg, g.W, g.H, g.p.x, g.p.y);
  },
  safeZone() {
    const g = this.g;
    const z = g.safeAt.get(g.p.y * g.W + g.p.x);
    return z && z.active ? z : null;
  },
  timeLeft(now) {
    const g = this.g;
    return Math.max(0, g.limit + g.bonus - ((g.over ? g.endAt : now) - g.t0));
  },

  end(win, reason) {
    const g = this.g;
    if (g.over) return;
    g.over = true;
    g.endAt = Date.now();
    const used = Math.round((g.endAt - g.t0) / 1000);
    if (win && (this.cleared[g.n] == null || used < this.cleared[g.n])) {
      this.cleared[g.n] = used;
      try { localStorage.setItem('maze-escape-cleared', JSON.stringify(this.cleared)); } catch (e) {}
    }
    this.held = [];
    Sound.stopMusic();
    Sound.play(win ? 'win' : 'lose');
    UI.showResult(win, reason, used, g.n);
  },

  tick() {
    const g = this.g;
    if (!g || g.over) return;
    const now = Date.now();
    if (this.timeLeft(now) <= 0) { this.end(false, '時間到!沒能在時限內逃出迷宮。'); return; }
    const dt = now - g.lastTick;
    g.lastTick = now;
    const z = this.safeZone();
    if (z) {
      z.energy -= dt;
      if (z.energy <= 0) {
        z.energy = 0; z.active = false;
        this.rebuildMG();
        this.say('這個安全區的力量耗盡了!快離開!', now, 'expire');
      }
    }
    const hk = this.held[this.held.length - 1];
    if (hk && now >= g.nextMove) this.tryMove(KEYMAP[hk], now);
    for (const m of g.mons) {
      if (g.over) return;
      if (now >= m.next) { m.next = now + this.act(m, now); this.checkHits(now); }
    }
    if (g.mons.some(m => m.dead)) g.mons = g.mons.filter(m => !m.dead);
    this.updateDanger(now);
  },

  // 最近的怪物越近,危險音樂越強;怪物剛進入 5 步內時發出警示音
  updateDanger(now) {
    const g = this.g;
    let best = 99, idx = -1;
    for (const m of g.mons) {
      if (m.hidden || now < m.stunUntil) continue;
      if (m.type === 'thief' && !g.hasKey) continue;
      let d = g.distP[m.y * g.W + m.x];
      if (d < 0) d = Math.round((Math.abs(m.x - g.p.x) + Math.abs(m.y - g.p.y)) * 1.2);
      if (d <= 5 && !m.alerted && (!m.alertAt || now - m.alertAt > 8000)) { m.alerted = true; m.alertAt = now; Sound.play('spot'); }
      if (d > 7) m.alerted = false;
      if (d < best) { best = d; idx = MONS.findIndex(x => x.id === m.type); }
    }
    let x = best >= 9 ? 0 : (9 - best) / 8;
    if (this.safeZone()) x *= 0.3;
    Sound.setDanger(x, idx);
  },

  tryMove(d, now) {
    const g = this.g;
    if (!g || g.over) return;
    g.facing = d;
    if (now < g.stuckUntil) return;
    const nx = g.p.x + d[0], ny = g.p.y + d[1];
    if (nx < 0 || ny < 0 || nx >= g.W || ny >= g.H) return;
    const v = g.grid[ny * g.W + nx];
    if (v === 1) { g.nextMove = now + 60; return; }
    if (v === 2) {
      if (g.hasKey) { g.p = { x: nx, y: ny }; this.end(true, '你用鑰匙打開大門,成功逃出迷宮!'); }
      else { this.say('大門鎖著,先去找鑰匙!', now, 'locked'); g.nextMove = now + 200; }
      return;
    }
    const ci = g.p.y * g.W + g.p.x;
    let cost = 140;
    if (g.mud[ci]) cost *= 1.8;
    const w = g.webs.get(ci);
    if (w && w > now) cost *= 2.4;
    if (this.gravityNear(now)) cost *= 2;
    g.p = { x: nx, y: ny };
    g.nextMove = now + cost;
    this.enterCell(now);
  },

  // 玩家進入新格子(走路或傳送)後的處理
  enterCell(now) {
    const g = this.g;
    const i = g.p.y * g.W + g.p.x;
    g.lastMove = now;
    g.trail.push({ x: g.p.x, y: g.p.y, t: now });
    if (!g.hasKey && g.p.x === g.key.x && g.p.y === g.key.y) { g.hasKey = true; this.say('拿到鑰匙了!快找出口大門!', now, 'key'); }
    const it = g.items.get(i);
    if (it) { g.items.delete(i); this.pickup(it, now); }
    if (g.traps.has(i)) {
      g.traps.delete(i);
      if (now < g.invUntil) this.say('護盾擋下了陷阱!', now, 'block');
      else { g.stuckUntil = now + TRAP_TIME; this.say('踩到陷阱!被困住 3 秒!', now, 'trap'); }
    }
    g.distP = bfs(g.mg, g.W, g.H, g.p.x, g.p.y);
    const z = this.safeZone();
    if (z) this.say('進入安全區!怪物無法進來,力量剩 ' + Math.ceil(z.energy / 1000) + ' 秒。', now, 'safe');
    this.checkHits(now);
  },

  pickup(t, now) {
    const g = this.g, it = ITEMS[t];
    if (t === 'hourglass') { g.bonus += 60000; this.say('撿到沙漏!時間 +1 分鐘', now, 'time'); }
    else if (t === 'heart') { g.lives++; this.say('撿到生命之心!增加 1 條命', now, 'heart'); }
    else { g.inv[t]++; this.say('撿到「' + it.name + '」!按 ' + (USABLE.indexOf(t) + 1) + ' 或點下方按鈕使用', now, 'item'); }
  },

  useItem(t) {
    const g = this.g;
    if (!g || g.over || !g.inv[t]) return;
    const now = Date.now();
    if (t === 'lamp') {
      g.lampUntil = Math.max(now, g.lampUntil) + 20000;
      this.say('點燃燈油,視野 +3 格!', now, 'lamp');
    } else if (t === 'shield') {
      g.invUntil = Math.max(now, g.invUntil) + 5000;
      g.stuckUntil = 0;
      this.say('護盾展開,無敵 5 秒!', now, 'shield');
    } else if (t === 'stun') {
      let best = null, bd = 1e9;
      for (const m of g.mons) {
        if (m.hidden) continue;
        const dd = Math.abs(m.x - g.p.x) + Math.abs(m.y - g.p.y);
        if (dd < bd) { bd = dd; best = m; }
      }
      if (!best) { this.say('附近沒有怪物可以暈眩', now); return; }
      best.stunUntil = now + 10000;
      this.say('「' + best.name + '」被暈眩 10 秒!', now, 'stun');
    } else if (t === 'scroll') {
      const spot = this.spotNearSafe();
      if (!spot) { this.say('找不到可以傳送的安全區', now); return; }
      g.p = spot;
      g.stuckUntil = 0;
      g.nextMove = now + 150;
      this.say('傳送到安全區旁!', now, 'teleport');
      g.inv[t]--;
      this.enterCell(now);
      return;
    }
    g.inv[t]--;
  },

  spotNearSafe() {
    const g = this.g;
    let zs = g.safes.filter(z => z.active);
    if (!zs.length) zs = g.safes.slice();
    for (let i = zs.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = zs[i]; zs[i] = zs[j]; zs[j] = t; }
    for (const z of zs) {
      if (z.x === g.p.x && z.y === g.p.y) continue;
      const opts = [];
      for (const [dx, dy] of DIRS) {
        const nx = z.x + dx, ny = z.y + dy;
        if (g.grid[ny * g.W + nx] !== 0) continue;
        if (g.mons.some(m => !m.hidden && Math.abs(m.x - nx) + Math.abs(m.y - ny) <= 1)) continue;
        opts.push({ x: nx, y: ny });
      }
      if (opts.length) return opts[Math.floor(Math.random() * opts.length)];
    }
    return null;
  },

  checkHits(now) {
    const g = this.g;
    if (g.over || this.safeZone()) return;
    for (const m of g.mons) {
      if (m.hidden || m.x !== g.p.x || m.y !== g.p.y) continue;
      if (now < m.stunUntil) continue;
      if (m.type === 'thief') {
        if (g.hasKey && now >= g.invUntil && !(m.until && now < m.until)) {
          g.hasKey = false;
          g.key = this.randFloor(10) || this.randFloor(0);
          m.until = now + 3000;
          this.say('竊鑰賊搶走了鑰匙,藏到別處去了!', now, 'steal');
        }
        continue;
      }
      if (now < g.invUntil) continue;
      if (g.lives > 0) {
        g.lives--;
        g.invUntil = now + 3000;
        g.stuckUntil = 0;
        m.stunUntil = now + 3000;
        this.say('被「' + m.name + '」抓到,失去 1 條命!3 秒內無敵', now, 'hurt');
        continue;
      }
      this.end(false, '你被「' + m.name + '」抓到了!');
      return;
    }
  },

  gravityNear(now) {
    const g = this.g;
    return g.mons.some(m => m.type === 'gravity' && now >= m.stunUntil && Math.abs(m.x - g.p.x) + Math.abs(m.y - g.p.y) <= 5);
  },

  // ---- 移動工具 ----
  dP(m) { const g = this.g; return g.distP[m.y * g.W + m.x]; },
  moveTo(m, x, y) { m.px = m.x; m.py = m.y; m.x = x; m.y = y; },
  stepDown(m, df) {
    const g = this.g;
    const cur = df[m.y * g.W + m.x];
    if (cur <= 0) return false;
    const opts = [];
    for (const [dx, dy] of DIRS) {
      const nx = m.x + dx, ny = m.y + dy;
      if (nx < 0 || ny < 0 || nx >= g.W || ny >= g.H) continue;
      const ni = ny * g.W + nx;
      if (g.mg[ni] !== 0) continue;
      const dv = df[ni];
      if (dv >= 0 && dv < cur) opts.push([nx, ny]);
    }
    if (!opts.length) return false;
    const o = opts[Math.floor(Math.random() * opts.length)];
    this.moveTo(m, o[0], o[1]);
    return true;
  },
  chase(m) { return this.stepDown(m, this.g.distP); },
  distFrom(pt) {
    const g = this.g;
    const k = pt.x + ',' + pt.y + ',' + g.ver;
    let d = g.cache.get(k);
    if (!d) { if (g.cache.size > 60) g.cache.clear(); d = bfs(g.mg, g.W, g.H, pt.x, pt.y); g.cache.set(k, d); }
    return d;
  },
  toward(m, tx, ty) { return this.stepDown(m, this.distFrom({ x: tx, y: ty })); },
  wander(m, ok) {
    const g = this.g;
    const opts = [];
    for (const [dx, dy] of DIRS) {
      const nx = m.x + dx, ny = m.y + dy;
      if (nx < 0 || ny < 0 || nx >= g.W || ny >= g.H) continue;
      if (g.mg[ny * g.W + nx] !== 0) continue;
      if (ok && !ok(nx, ny)) continue;
      opts.push([nx, ny]);
    }
    if (!opts.length) return;
    let c = opts.filter(o => !(o[0] === m.px && o[1] === m.py));
    if (!c.length) c = opts;
    const o = c[Math.floor(Math.random() * c.length)];
    this.moveTo(m, o[0], o[1]);
  },
  randFloor(minD) {
    const g = this.g;
    const c = [];
    for (let i = 0; i < g.W * g.H; i++) if (g.mg[i] === 0 && g.distP[i] >= minD) c.push(i);
    if (!c.length) return null;
    const i = c[Math.floor(Math.random() * c.length)];
    return { x: i % g.W, y: Math.floor(i / g.W) };
  },
  cellsAtDist(a, b) {
    const g = this.g;
    const c = [];
    for (let i = 0; i < g.W * g.H; i++) if (g.mg[i] === 0 && g.distP[i] >= a && g.distP[i] <= b) c.push(i);
    if (!c.length) return null;
    const i = c[Math.floor(Math.random() * c.length)];
    return { x: i % g.W, y: Math.floor(i / g.W) };
  },
  ahead(k) {
    const g = this.g;
    let x = g.p.x, y = g.p.y;
    for (let i = 0; i < k; i++) {
      const nx = x + g.facing[0], ny = y + g.facing[1];
      if (nx < 0 || ny < 0 || nx >= g.W || ny >= g.H || g.grid[ny * g.W + nx] !== 0) break;
      x = nx; y = ny;
    }
    return { x, y };
  },
  nearestFloor(x, y) {
    const g = this.g;
    x = Math.max(1, Math.min(g.W - 2, x)); y = Math.max(1, Math.min(g.H - 2, y));

  // ---- 每種怪物的 AI,回傳下次行動的間隔(毫秒) ----
  act(m, now) {

      case 'ambush':
        if (near(3)) this.chase(m);

      case 'hound': {

        if (near(3)) { this.chase(m); m.ti = tr.length - 1; return 330; }

          let j = m.ti;
          for (let k = tr.length - 1; k > m.ti; k--) if (tr[k].x === m.x && tr[k].y === m.y) { j = k; break; }

      case 'phantom': {

        return 330;
      }
      case 'mirror': {

      }
      case 'abyss': {
        if (!m.nd) m.nd = g.t0 + 20000;
        if (now >= m.nd) { g.darkUntil = now + 6000; m.nd = now + 20000; this.say('深淵之王讓黑暗降臨,視野縮成 1 格!', now, 'dark'); }
        this.chase(m);
        return 320;
      }
      case 'clone': {
        if (!m.nc) m.nc = g.t0 + 20000;

          m.nc = now + 20000;

          if (spot) {
            g.mons.push(Object.assign({}, CLONELING, { type: 'cloneling', x: spot.x, y: spot.y, px: spot.x, py: spot.y, next: now + 400, stunUntil: 0, hidden: false, expire: now + 10000 }));

          }

        return 440;
      }
      case 'cloneling':
        if (now >= m.expire) { m.dead = true; m.hidden = true; return 1000; }
        this.chase(m);
        return 380;
      case 'gravity':
        this.chase(m);
        return 500;
      case 'rewind': {
        if (!m.nr) m.nr = g.t0 + 30000;
        if (now >= m.nr && near(12)) {
          m.nr = now + 30000;
          const tr = g.trail;
          let k = tr.length - 1;
          while (k > 0 && tr[k].t > now - 5000) k--;

          if (back && (back.x !== p.x || back.y !== p.y)) {
            g.p = { x: back.x, y: back.y };

          }
        }
        if (near(10)) this.chase(m); else this.wander(m);
        return 520;
      }
      case 'frost':
        if (d >= 0 && d <= 2 && (!m.nf || now >= m.nf) && now >= g.invUntil) {
          m.nf = now + 8000;
          g.stuckUntil = Math.max(g.stuckUntil, now + 1500);
          this.say('冰霜巨人凍住了你!', now, 'trap');
        }
        this.chase(m);
        return 620;
      case 'core': {
        if (near(7)) { this.chase(m); return 290; }
        if (!m.nt) m.nt = g.t0 + 25000;
        const obj = g.hasKey ? g.doorIn : g.key;
        if (now >= m.nt) {
          m.nt = now + 25000;
          const spot = this.nearestFloor(obj.x + (Math.random() < 0.5 ? 2 : -2), obj.y + (Math.random() < 0.5 ? 2 : -2));

            this.moveTo(m, spot.x, spot.y);
            this.say('迷宮之心瞬移到' + (g.hasKey ? '大門' : '鑰匙') + '附近守候!', now, 'blink');

          }
        }
        if (!this.toward(m, obj.x, obj.y)) this.wander(m);
        return 420;
      }
    }
    return 500;
  }
};

// ---------------- 畫面 ----------------
const $ = (id) => document.getElementById(id);
const cv = $('cv');
const ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = cv.height = Math.round(540 * DPR);

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);

function drawKey(cx, cy, s, color) {

  ctx.restore();
}
function drawDoor(cx, cy, color) {
  ctx.save(); ctx.translate(cx - 20, cy - 20); ctx.scale(40 / 24, 40 / 24);
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.strokeRect(5, 2.5, 14, 19);
  ctx.beginPath(); ctx.arc(15.5, 12, 1.2, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2, 21.5); ctx.lineTo(22, 21.5); ctx.stroke();
  ctx.restore();
}
function shieldPath(cx, cy, s) {
  ctx.beginPath();

  ctx.lineTo(cx + 13 * s, cy + 1 * s);
  ctx.quadraticCurveTo(cx + 13 * s, cy + 11 * s, cx, cy + 17 * s);
  ctx.quadraticCurveTo(cx - 13 * s, cy + 11 * s, cx - 13 * s, cy + 1 * s);

// 安全區:整格方形 + 盾牌 + 能量條(與圓形紅圈的怪物明顯不同)
function drawSafe(px, py, z, now, lit) {
  const cx = px + 30, cy = py + 30;
  ctx.save();
  if (!z.active) {
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(160,170,180,0.4)'; ctx.lineWidth = 2;
    rrect(px + 5, py + 5, 50, 50, 8); ctx.stroke();

  ctx.restore();
}
function drawItem(cx, cy, t, now) {

  const stunned = now < m.stunUntil;

let fxCache = '';
function draw() {
  const g = Game.g;
  if (!g) return;
  const now = Date.now();
  const T = g.theme;
  let fog = now < g.darkUntil;
  for (const m of g.mons) if (m.type === 'mist' && now >= m.stunUntil && Math.max(Math.abs(m.x - g.p.x), Math.abs(m.y - g.p.y)) <= 4) fog = true;
  const lamp = now < g.lampUntil;
  const vis = (fog ? 1 : BASE_VIS) + (lamp ? 3 : 0);
  const R = lamp ? 5 : 4;
  const S = cv.width / ((2 * R + 1) * 60);
  const monAt = new Map();
  for (const m of g.mons) {
    if (m.hidden) continue;
    const ch = Math.max(Math.abs(m.x - g.p.x), Math.abs(m.y - g.p.y));
    if (m.type === 'shade' && !lamp && !(ch <= 1 || (now % 2400) < 300)) continue;
    const k = m.y * g.W + m.x;
    if (!monAt.has(k)) monAt.set(k, m);

  const TILE = 60;
  for (let vy = -R; vy <= R; vy++) for (let vx = -R; vx <= R; vx++) {
    const x = g.p.x + vx, y = g.p.y + vy;
    const ch = Math.max(Math.abs(vx), Math.abs(vy));
    if (x < 0 || y < 0 || x >= g.W || y >= g.H) continue;
    const px = (vx + R) * TILE, py = (vy + R) * TILE;
    const cx = px + TILE / 2, cy = py + TILE / 2;
    const i = y * g.W + x, val = g.grid[i];
    const zone = g.safeAt.get(i);
    if (ch > vis) {

      if (zone && zone.active) drawSafe(px, py, zone, now, false);

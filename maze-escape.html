      ctx.fillStyle = T[5]; ctx.fillRect(px, py, TILE, TILE);
      if (g.vaultFloor.has(i)) {
        ctx.fillStyle = 'rgba(242,181,68,0.16)'; ctx.fillRect(px, py, TILE, TILE);
        ctx.strokeStyle = 'rgba(242,181,68,0.35)'; ctx.lineWidth = 1; ctx.strokeRect(px + 4, py + 4, TILE - 8, TILE - 8);
      }
      if (g.mud[i]) { ctx.fillStyle = 'rgba(78,58,32,0.8)'; ctx.beginPath(); ctx.ellipse(cx, cy, 20, 16, 0, 0, Math.PI * 2); ctx.fill(); }
      const w = g.webs.get(i);
      if (w && w > now) {
        ctx.strokeStyle = 'rgba(232,232,244,0.55)'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(px, py); ctx.lineTo(px + TILE, py + TILE); ctx.moveTo(px + TILE, py); ctx.lineTo(px, py + TILE);
        ctx.moveTo(cx, py); ctx.lineTo(cx, py + TILE); ctx.moveTo(px, cy); ctx.lineTo(px + TILE, cy);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, 21, 0, Math.PI * 2); ctx.stroke();
      }
      if (zone) drawSafe(px, py, zone, now, true);
      if (g.traps.has(i)) drawTrap(cx, cy);
      const it = g.items.get(i);
      if (it) drawItem(cx, cy, it, now);
      if (!g.hasKey && g.key.x === x && g.key.y === y) drawKey(cx, cy, 38 / 24, '#f2b544');
    }
    const m = monAt.get(i);
    if (m) drawMonster(cx, cy, m, now);
    ctx.globalAlpha = 1;
  }
  // 玩家
  const pcx = R * TILE + TILE / 2, pcy = pcx;
  const inv = now < g.invUntil, stuck = now < g.stuckUntil;
  ctx.shadowColor = 'rgba(242,181,68,0.75)'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#f7d38a'; ctx.beginPath(); ctx.arc(pcx, pcy, 17, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(242,181,68,0.35)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(pcx, pcy, 19, 0, Math.PI * 2); ctx.stroke();
  if (inv) {
    ctx.strokeStyle = 'rgba(127,240,200,' + (0.6 + 0.4 * Math.sin(now / 120)) + ')'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(pcx, pcy, 25, 0, Math.PI * 2); ctx.stroke();
  }
  if (stuck) drawTrap(pcx, pcy + 16);
  ctx.fillStyle = '#5a3a00';
  ctx.beginPath(); ctx.arc(pcx + g.facing[0] * 9, pcy + g.facing[1] * 9, 3, 0, Math.PI * 2); ctx.fill();
  if (g.hasKey) drawKey(pcx, pcy + 1, 0.7, '#5a3a00');
  // 燈光
  const lr = 60 * (vis + 0.8);
  const grd = ctx.createRadialGradient(pcx, pcy, 0, pcx, pcy, lr);
  grd.addColorStop(0, 'rgba(255,196,110,0.14)'); grd.addColorStop(0.65, 'rgba(255,196,110,0.05)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, (2 * R + 1) * TILE, (2 * R + 1) * TILE);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // 狀態標籤
  const fx = [];
  if (lamp) fx.push('<span style="color:#ffd35c">視野 +3 · ' + Math.ceil((g.lampUntil - now) / 1000) + ' 秒</span>');
  if (inv) fx.push('<span style="color:#7ff0c8">無敵 · ' + Math.ceil((g.invUntil - now) / 1000) + ' 秒</span>');
  if (stuck) fx.push('<span style="color:#e5c38e">被陷阱困住 · ' + Math.ceil((g.stuckUntil - now) / 1000) + ' 秒</span>');
  if (Game.gravityNear(now)) fx.push('<span style="color:#c7b8ff">重力拖慢</span>');
  if (now < g.darkUntil) fx.push('<span style="color:#d9a8ff">黑暗降臨</span>');
  else if (fog) fx.push('<span style="color:#bfe3ee">迷霧籠罩</span>');
  fx.push('<span class="lives">額外生命 × ' + g.lives + '</span>');
  const fxs = fx.join('');
  if (fxs !== fxCache) { $('fx').innerHTML = fxs; fxCache = fxs; }

  // HUD
  const left = Game.timeLeft(now);
  const danger = left < 60000;
  const tc = danger ? '#ff6b5e' : '#f2b544';
  $('timeText').textContent = fmt(left / 1000);
  $('timeText').style.color = tc;
  $('timeBar').style.width = Math.min(100, left / (g.limit + g.bonus) * 100) + '%';
  $('timeBar').style.background = tc;
  $('board').classList.toggle('danger', danger);
  $('objective').textContent = g.hasKey ? '前往出口大門' : '尋找鑰匙';
  $('keyIc').classList.toggle('have', g.hasKey);
  const sz = Game.safeZone();
  const hot = now < g.msgUntil;
  $('msg').textContent = hot ? g.msg : (g.hasKey ? '鑰匙到手,大門在迷宮外牆上。' : '四處探索,鑰匙藏在迷宮深處。');
  $('msg').classList.toggle('hot', hot && !sz);
  $('msg').classList.toggle('safe', !!sz);
  if (sz) $('msg').textContent = '安全區內:怪物無法靠近,也追丟了你的蹤跡(剩 ' + Math.ceil(sz.energy / 1000) + ' 秒)';
  const act = g.safes.filter(z => z.active).length;
  $('safeTag').textContent = '安全區 ' + act + ' / ' + g.safes.length;
  $('mTime').textContent = fmt(left / 1000);
  $('mTime').style.color = tc;
  $('mKey').classList.toggle('have', g.hasKey);
  $('mSafe').textContent = '安全區 ' + act;
  const tipNow = now - g.t0 < 7000 && !sz;
  $('mMsg').textContent = tipNow ? '提示:' + TIPS[g.n - 1] : sz ? '安全區內,剩 ' + Math.ceil(sz.energy / 1000) + ' 秒' : (hot ? g.msg : (g.hasKey ? '鑰匙到手!找外牆上的大門' : '在迷宮上滑動或按方向鍵移動'));
  $('mMsg').classList.toggle('hot', hot && !sz);
  $('mMsg').classList.toggle('safe', !!sz);
  for (const t of USABLE) {
    const b = $('ib-' + t);
    b.querySelector('.ct').textContent = '× ' + g.inv[t];
    b.disabled = !g.inv[t] || g.over;
  }
  const cp = $('compass');
  if (Game.compass) {
    const tgt = g.hasKey ? g.door : g.key;
    cp.style.display = 'block';
    cp.style.transform = 'rotate(' + Math.round(Math.atan2(tgt.y - g.p.y, tgt.x - g.p.x) * 180 / Math.PI + 90) + 'deg)';
  } else cp.style.display = 'none';
}

// ---------------- 線上排行榜(claude.ai 登入身分 + 共享資料庫) ----------------
// 每位玩家一份文件 scores/<玩家 id>:{ name, best: { "關卡": 秒數 }, updated }
const Online = {
  ready: false, avail: false, db: null, user: null, uid: null, canWrite: null, readonly: false,
  rows: [], mine: null, pending: null, chain: Promise.resolve(),

  async init() {
    const C = window.claude;
    if (C && typeof C.use === 'function') {
      try {
        const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
        this.db = db; this.user = user; this.avail = !!db;
        if (user) {
          this.uid = await user.id();
          this.canWrite = await user.can('data.write');
        }
        if (db) {
          db.collection('scores').onSnapshot((snap) => {
            this.rows = snap.docs.filter(d => d.exists).map(d => this.clean(d.id, d.data())).filter(Boolean);
            const mine = this.rows.find(r => r.id === this.uid);
            if (mine) this.mine = { name: mine.name, best: Object.assign({}, mine.best) };
            UI.renderBoard();
          }, () => { this.avail = false; UI.renderBoard(); });
        }
      } catch (e) { this.avail = false; }
    }
    this.ready = true;
    UI.renderBoard();
  },

  // 其他玩家寫入的資料一律視為不可信:只取需要的欄位並檢查格式
  clean(id, d) {
    if (!d || typeof d.name !== 'string') return null;
    const best = {};
    if (d.best && typeof d.best === 'object') {
      for (let n = 1; n <= LEVELS; n++) {
        const v = d.best[n];
        if (typeof v === 'number' && isFinite(v) && v > 0 && v < 100000) best[n] = Math.round(v);
      }
    }
    return { id, name: d.name.slice(0, 12), best };
  },

  state() {
    if (!this.ready) return 'loading';
    if (!this.avail) return 'offline';
    if (!this.uid) return 'nologin';
    if (this.canWrite === false || this.readonly) return 'readonly';
    if (!this.mine || !this.mine.name) return 'noname';
    return 'ok';
  },

  write(data) {
    const ref = this.db.doc('scores/' + this.uid);
    const p = this.chain.then(() => ref.set(data));
    this.chain = p.catch(() => {});
    return p.catch((e) => {
      if (e && e.code === 'invalid_argument') this.readonly = true;
      UI.renderBoard();
      throw e;
    });
  },

  upsertLocal() {
    const row = { id: this.uid, name: this.mine.name, best: Object.assign({}, this.mine.best) };
    const i = this.rows.findIndex(r => r.id === this.uid);
    if (i >= 0) this.rows[i] = row; else this.rows.push(row);
    UI.renderBoard();
  },

  async saveName(raw) {
    const name = String(raw || '').trim().slice(0, 12);
    if (!name || !this.avail || !this.uid) return false;
    this.mine = { name, best: Object.assign({}, this.mine ? this.mine.best : {}) };
    if (this.pending) {
      const { n, sec } = this.pending;
      if (this.mine.best[n] == null || sec < this.mine.best[n]) this.mine.best[n] = sec;
    }
    this.upsertLocal();
    try {
      await this.write({ name, best: this.mine.best, updated: Date.now() });
      return true;
    } catch (e) { return false; }
  },

  async record(n, sec) {
    const best = Object.assign({}, this.mine.best);
    const prev = best[n];
    const improved = prev == null || sec < prev;
    if (improved) {
      best[n] = sec;
      this.mine = { name: this.mine.name, best };
      this.upsertLocal();
      try { await this.write({ name: this.mine.name, best, updated: Date.now() }); }
      catch (e) { return { failed: true }; }
    }
    return { improved, prev };
  },

  levelRank(n) {
    return this.rows.filter(r => r.best[n] != null).sort((a, b) => a.best[n] - b.best[n]);
  },
  overallRank() {
    return this.rows.map(r => {
      const ks = Object.keys(r.best);
      return { id: r.id, name: r.name, cleared: ks.length, total: ks.reduce((s, k) => s + r.best[k], 0) };
    }).filter(r => r.cleared > 0).sort((a, b) => b.cleared - a.cleared || a.total - b.total);
  },

  // 過關後:記錄成績並回報名次
  async onWin(n, sec) {
    const box = $('rBoard');
    const st = this.state();
    this.pending = null;
    $('rNameForm').classList.add('hidden');
    if (st === 'offline') { box.textContent = '排行榜只在線上版提供(在 claude.ai 開啟並登入)。'; return; }
    if (st === 'loading') { box.textContent = ''; return; }
    if (st === 'nologin') { box.textContent = '登入 claude.ai 後就能把通關時間記錄到排行榜。'; return; }
    if (st === 'readonly') { box.textContent = '你目前只有檢視權限,這次成績沒有記錄到排行榜。'; return; }
    if (st === 'noname') {
      this.pending = { n, sec };
      box.textContent = '輸入玩家名稱,就能把這次的通關時間記錄到排行榜:';
      $('rNameForm').classList.remove('hidden');
      return;
    }
    box.textContent = '正在記錄成績…';
    const res = await this.record(n, sec);
    this.showRank(n, sec, res);
  },

  showRank(n, sec, res) {
    const box = $('rBoard');
    if (res.failed) { box.textContent = '成績沒有記錄成功,請稍後再試。'; return; }
    const list = this.levelRank(n);
    const rank = list.findIndex(r => r.id === this.uid) + 1;
    box.innerHTML = '';
    const b = document.createElement('b');
    if (res.improved) {
      b.textContent = res.prev == null ? '成績已記錄!' : '新紀錄!';
      box.append(b, document.createTextNode('第 ' + n + ' 關排行榜第 ' + rank + ' 名(共 ' + list.length + ' 人)'));
    } else {
      box.append(document.createTextNode('你的最佳紀錄是 '), Object.assign(b, { textContent: fmt(res.prev) }),
        document.createTextNode(',目前排行第 ' + rank + ' 名。'));
    }
  }
};

const UI = {
  renderMenu() {
    const box = $('tiers');
    box.innerHTML = '';
    for (let t = 0; t < LEVELS / 5; t++) {
      const n0 = t * 5 + 1;
      const extras = [(t + 1) + ' 隻怪物同時追捕'];
      if (n0 >= ITEM_FROM) extras.push('道具 ' + (2 * (t + 1)) + ' 個');
      if (n0 >= TRAP_FROM) extras.push('陷阱');
      if (n0 + 4 >= VAULT_FROM) extras.push('密室');
      extras.push('限時 ' + timeLimit(n0) / 60000 + ' 分鐘');
      const tier = document.createElement('div');
      tier.className = 'tier';
      tier.innerHTML = '<div class="tier-h"><b>第 ' + n0 + '–' + (n0 + 4) + ' 關</b><span>' + extras.join(' · ') + '</span></div>';
      const grid = document.createElement('div');
      grid.className = 'grid5';
      for (let k = 0; k < 5; k++) {
        const n = n0 + k, th = THEMES[n - 1], sz = sizeOf(n), best = Game.cleared[n];
        const b = document.createElement('button');
        b.className = 'card';
        b.innerHTML =
          '<div style="display:flex;align-items:baseline;gap:10px"><span class="n">' + pad2(n) + '</span><span class="t">' + th[0] + '</span></div>' +
          '<span class="s">' + sz.W + ' × ' + sz.H + ' 格' + (MONS[n - 1] ? ' · 新怪物「' + MONS[n - 1].name + '」' : '') + '</span>' +
          '<span class="m">怪物:' + lineup(n).map(i => MONS[i].name).join('、') + '</span>' +
          (best != null ? '<span class="done">通關 ' + fmt(best) + '</span>' : '');
        b.addEventListener('click', () => Game.start(n));
        grid.appendChild(b);
      }
      tier.appendChild(grid);
      box.appendChild(tier);
    }
    $('clearedChip').textContent = '已通關 ' + Object.keys(Game.cleared).length + ' / ' + LEVELS;
  },
  showMenu() {
    Game.g = null; Game.held = [];
    if (FS.on) FS.exit();
    Sound.stopMusic();
    $('overlay').classList.remove('show');
    $('play').classList.add('hidden');
    $('menu').classList.remove('hidden');
    this.renderMenu();
  },
  showPlay(g) {
    $('overlay').classList.remove('show');
    $('menu').classList.add('hidden');
    $('play').classList.remove('hidden');
    const T = g.theme;
    $('lvlNum').textContent = '第 ' + pad2(g.n) + ' 關';
    $('themeName').textContent = T[0];
    $('mLvl').textContent = pad2(g.n);
    $('mName').textContent = T[0];
    wakeLock();
    if (!FS.on && FS.auto()) FS.enter();
    $('tags').innerHTML = '<span class="tag">' + g.W + ' × ' + g.H + ' 格</span><span class="tag">' + ALGO[T[1]] + '</span>' +
      (T[4] > 0 ? '<span class="tag mud">' + T[7] + ':移動減速</span>' : '') +
      (g.traps.size ? '<span class="tag trap">陷阱 ' + g.traps.size + ' 個</span>' : '') +
      '<span class="tag safe" id="safeTag"></span>';
    $('monCount').textContent = g.mons.length + ' 隻 · 道具 ' + g.items.size + ' 個';
    $('roster').innerHTML = lineup(g.n).map(i => {
      const m = MONS[i], c = ITEMS[m.counter];
      return '<div class="mon"><div class="glyph" style="background:' + m.color + ';color:' + m.ink + '">' + m.glyph + '</div>' +
        '<div style="min-width:0"><div class="top"><span class="nm">' + m.name + '</span><span class="ai">' + m.ai + '</span>' +
        '<span class="counter">剋星 ' + hexHTML(m.counter) + c.name + '</span></div>' +
        '<div class="ds">' + m.desc + '</div></div></div>';
    }).join('');
    fxCache = '';
    $('tipBox').innerHTML = '<b>闖關提示</b>';
    $('tipBox').append(document.createTextNode(TIPS[g.n - 1]));
    try { window.getSelection().removeAllRanges(); } catch (e) {}
    window.scrollTo(0, 0);
  },
  renderBoard() {
    const st = Online.state();
    const status = $('lbStatus');
    const form = $('nameForm');
    const msgs = {
      loading: '正在連線排行榜…',
      offline: '排行榜只在線上版提供:請用 claude.ai 上的遊戲連結開啟並登入。下載版仍可正常遊玩。',
      nologin: '請先登入 claude.ai,才能記錄通關時間並參加排行。',
      readonly: '你目前只有檢視權限:可以看排行榜,但無法記錄成績。請遊戲擁有者在分享設定把你設為「Contributor(參與者)」。',
      noname: '設定玩家名稱後,每次通關的時間都會記錄到排行榜。'
    };
    status.classList.toggle('warn', st !== 'ok');
    if (st === 'ok') {
      const done = Object.keys(Online.mine.best).length;
      status.textContent = '';
      const b = document.createElement('b');
      b.textContent = Online.mine.name;
      status.append(document.createTextNode('已登入,玩家名稱:'), b, document.createTextNode('。已記錄 ' + done + ' 關的通關時間,可以隨時改名。'));
    } else status.textContent = msgs[st];
    form.classList.toggle('hidden', !(st === 'ok' || st === 'noname'));
    $('nickSave').textContent = st === 'ok' ? '更改名稱' : '儲存名稱';
    if (st === 'ok' && document.activeElement !== $('nickInput') && !$('nickInput').value) $('nickInput').value = Online.mine.name;

    const sel = $('lbSelect');
    if (!sel.options.length) {
      sel.append(new Option('總排行(通關數 → 總時間)', 'all'));
      for (let n = 1; n <= LEVELS; n++) sel.append(new Option('第 ' + n + ' 關 · ' + THEMES[n - 1][0], String(n)));
    }
    const wrap = $('lbTable');
    wrap.innerHTML = '';
    if (!Online.avail) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = st === 'loading' ? '讀取中…' : '目前無法顯示排行榜。'; wrap.append(d); return; }
    const v = sel.value;
    const list = v === 'all' ? Online.overallRank() : Online.levelRank(+v).map(r => ({ id: r.id, name: r.name, time: r.best[+v] }));
    if (!list.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = '還沒有人記錄成績,成為第一個吧!'; wrap.append(d); return; }
    const table = document.createElement('table');
    const head = document.createElement('tr');
    (v === 'all' ? ['名次', '玩家', '通關數', '總時間'] : ['名次', '玩家', '通關時間']).forEach((h, k, arr) => {
      const th = document.createElement('th'); th.textContent = h;
      if (k === arr.length - 1) th.style.textAlign = 'right';
      head.append(th);
    });
    table.append(head);
    const myIdx = list.findIndex(r => r.id === Online.uid);
    const show = list.slice(0, 10).map((r, i) => [r, i]);
    if (myIdx >= 10) show.push([list[myIdx], myIdx]);
    for (const [r, i] of show) {
      const tr = document.createElement('tr');
      if (r.id === Online.uid) tr.className = 'me';
      const cells = v === 'all' ? [i + 1, r.name, r.cleared + ' 關', fmt(r.total)] : [i + 1, r.name, fmt(r.time)];
      cells.forEach((c, k) => {
        const td = document.createElement('td');
        td.textContent = String(c) + (k === 1 && r.id === Online.uid ? '(你)' : '');
        if (k === 0) td.className = 'rk';
        if (k === cells.length - 1) td.className = 'tm';
        tr.append(td);
      });
      table.append(tr);
    }
    wrap.append(table);
  },
  showResult(win, reason, used, n) {
    $('rTag').textContent = win ? 'ESCAPED' : 'CAUGHT';
    $('rTag').style.color = win ? '#8fe8a8' : '#ff6b5e';
    $('rTitle').textContent = win ? (n === LEVELS ? '全部通關!' : '成功逃脫!') : '逃脫失敗';
    $('rReason').textContent = reason;
    $('rTime').textContent = '用時 ' + fmt(used);
    $('resultBox').style.borderColor = win ? '#2f5a3c' : '#6a2a24';
    $('rNext').classList.toggle('hidden', !(win && n < LEVELS));
    $('rTip').classList.toggle('hidden', win);
    if (!win) { $('rTip').innerHTML = '<b>提示</b>'; $('rTip').append(document.createTextNode(TIPS[n - 1])); }
    $('rBoard').textContent = '';
    $('rNameForm').classList.add('hidden');
    if (win) Online.onWin(n, used);
    $('overlay').classList.add('show');
    setTimeout(() => (win && n < LEVELS ? $('rNext') : $('rRetry')).focus(), 30);
  }
};

// ---------------- 全螢幕 ----------------
// 先用 CSS 讓遊戲鋪滿畫面(所有裝置都可用),瀏覽器支援時再進入真正的全螢幕
const FS = {
  on: false,
  real: false,
  enter() {
    document.body.classList.add('fs');
    this.on = true;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !(document.fullscreenElement || document.webkitFullscreenElement)) {
      try {
        const r = req.call(el, { navigationUI: 'hide' });
        this.real = true;
        if (r && r.catch) r.catch(() => { this.real = false; });
      } catch (e) { this.real = false; }
    }
    this.sync();
  },
  exit() {
    document.body.classList.remove('fs');
    this.on = false;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      const ex = document.exitFullscreen || document.webkitExitFullscreen;
      try { const r = ex.call(document); if (r && r.catch) r.catch(() => {}); } catch (e) {}
    }
    this.real = false;
    this.sync();
  },
  toggle() { if (this.on) this.exit(); else this.enter(); },
  sync() {
    $('btnFs').textContent = this.on ? '離開全螢幕' : '全螢幕模式';
    $('fsBtn').setAttribute('aria-label', this.on ? '離開全螢幕' : '進入全螢幕');
  },
  auto() {
    let pref = null;
    try { pref = localStorage.getItem('maze-fs'); } catch (e) {}
    if (pref === null) return window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    return pref === '1';
  }
};
const onFsChange = () => {
  // 使用者用返回鍵或 Esc 離開真正的全螢幕時,一併恢復一般版面
  if (!(document.fullscreenElement || document.webkitFullscreenElement) && FS.real) {
    FS.real = false;
    document.body.classList.remove('fs');
    FS.on = false;
    FS.sync();
  }
};
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
$('fsBtn').addEventListener('click', () => FS.toggle());
$('btnFs').addEventListener('click', () => FS.toggle());
$('fsToggle').checked = FS.auto();
$('fsToggle').addEventListener('change', (e) => {
  try { localStorage.setItem('maze-fs', e.target.checked ? '1' : '0'); } catch (err) {}
});

// 聲音開關
function syncSound() {
  document.body.classList.toggle('muted', Sound.muted);
  $('btnSnd').textContent = Sound.muted ? '聲音:關' : '聲音:開';
  $('sndBtn').setAttribute('aria-label', Sound.muted ? '開啟聲音' : '靜音');
  $('musicToggle').checked = Sound.musicOn;
  $('sfxToggle').checked = Sound.sfxOn;
  Sound.applyVolumes();
}
const toggleMute = () => { Sound.init(); Sound.muted = !Sound.muted; syncSound(); };
$('sndBtn').addEventListener('click', toggleMute);
$('btnSnd').addEventListener('click', toggleMute);
$('musicToggle').addEventListener('change', (e) => {
  Sound.musicOn = e.target.checked;
  try { localStorage.setItem('maze-music', Sound.musicOn ? '1' : '0'); } catch (err) {}
  syncSound();
});
$('sfxToggle').addEventListener('change', (e) => {
  Sound.sfxOn = e.target.checked;
  try { localStorage.setItem('maze-sfx', Sound.sfxOn ? '1' : '0'); } catch (err) {}
  Sound.init(); syncSound(); Sound.play('item');
});
syncSound();

// 背包按鈕與道具說明
$('inv').innerHTML = USABLE.map((t, k) => {
  const it = ITEMS[t];
  return '<button class="ibtn" id="ib-' + t + '" title="' + it.desc + '" aria-label="使用' + it.name + ':' + it.desc + '">' +
    hexHTML(t) + '<span class="nm">' + it.name + '</span><span class="ct">× 0</span><kbd>' + (k + 1) + '</kbd></button>';
}).join('');
USABLE.forEach(t => $('ib-' + t).addEventListener('click', () => Game.useItem(t)));
$('itemLegend').innerHTML = ITEM_KEYS.map(t => '<span class="lg">' + hexHTML(t) + '<span>' + ITEMS[t].name + ' <small>' + ITEMS[t].desc + '</small></span></span>').join('');

// ---------------- 輸入 ----------------
document.addEventListener('keydown', (e) => {
  if (!Game.g) return;
  if (e.key === 'Escape') { if (FS.on) FS.exit(); else UI.showMenu(); return; }
  if (Game.g.over) return;
  const slot = '1234'.indexOf(e.key);
  if (slot >= 0) { Game.useItem(USABLE[slot]); return; }
  const d = KEYMAP[e.key];
  if (!d) return;
  e.preventDefault();
  if (!Game.held.includes(e.key)) Game.held.push(e.key);
  const now = Date.now();
  if (now >= Game.g.nextMove) Game.tryMove(d, now);
});
document.addEventListener('keyup', (e) => { Game.held = Game.held.filter(k => k !== e.key); });
window.addEventListener('blur', () => { Game.held = []; });

document.querySelectorAll('.dpad button').forEach(b => {
  const k = b.dataset.k;
  const release = () => { Game.held = Game.held.filter(x => x !== k); };
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!Game.held.includes(k)) Game.held.push(k);
    const now = Date.now();
    if (Game.g && !Game.g.over && now >= Game.g.nextMove) Game.tryMove(KEYMAP[k], now);
  });
  b.addEventListener('pointerup', release);
  b.addEventListener('pointerleave', release);
  b.addEventListener('pointercancel', release);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
});

$('btnRestart').addEventListener('click', () => { if (Game.g) Game.start(Game.g.n); });
$('btnMenu').addEventListener('click', () => UI.showMenu());
$('mMenu').addEventListener('click', () => UI.showMenu());
$('rRetry').addEventListener('click', () => { if (Game.g) Game.start(Game.g.n); });
$('rNext').addEventListener('click', () => { if (Game.g && Game.g.n < LEVELS) Game.start(Game.g.n + 1); });
$('rMenu').addEventListener('click', () => UI.showMenu());

// 在迷宮上滑動:手指往哪個方向拉,就持續往那邊走,放開停止
let swipe = null;
const setSwipe = (k) => {
  if (swipe.k === k) return;
  Game.held = Game.held.filter(x => x !== swipe.k);
  swipe.k = k;
  if (!k) return;
  Game.held.push(k);
  const now = Date.now();
  if (Game.g && !Game.g.over && now >= Game.g.nextMove) Game.tryMove(KEYMAP[k], now);
};
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  swipe = { x: e.clientX, y: e.clientY, k: null };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', (e) => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.hypot(dx, dy) < 18) { setSwipe(null); return; }
  setSwipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp'));
});
const endSwipe = () => { if (swipe) { setSwipe(null); swipe = null; } };
cv.addEventListener('pointerup', endSwipe);
cv.addEventListener('pointercancel', endSwipe);

// 遊戲中保持螢幕常亮(不支援就略過)
let lock = null;
function wakeLock() {
  try {
    if (lock || !navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(l => { lock = l; l.addEventListener('release', () => { lock = null; }); }).catch(() => {});
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Game.g) wakeLock(); });

try { Game.compass = localStorage.getItem('maze-escape-compass') === '1'; } catch (e) {}
$('compassToggle').checked = Game.compass;
$('compassToggle').addEventListener('change', (e) => {
  Game.compass = e.target.checked;
  try { localStorage.setItem('maze-escape-compass', Game.compass ? '1' : '0'); } catch (err) {}
});
try { Game.cleared = JSON.parse(localStorage.getItem('maze-escape-cleared') || '{}') || {}; } catch (e) { Game.cleared = {}; }

// 排行榜表單
$('lbSelect').addEventListener('change', () => UI.renderBoard());
$('nameForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const ok = await Online.saveName($('nickInput').value);
  if (ok) $('nickInput').value = Online.mine.name;
});
$('rNameForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const p = Online.pending;
  if (!p) return;
  const ok = await Online.saveName($('rNick').value);
  $('rNameForm').classList.add('hidden');
  Online.pending = null;
  if (ok) Online.showRank(p.n, p.sec, { improved: true, prev: null });
  else $('rBoard').textContent = '名稱沒有儲存成功,請稍後再試。';
});

// 手機:避免長按選到文字或跳出選單而卡住操作
document.addEventListener('selectstart', (e) => {
  const t = e.target && e.target.closest ? e.target : null;
  if (Game.g && !(t && t.closest('input'))) e.preventDefault();
});
document.addEventListener('contextmenu', (e) => {
  if (Game.g && e.target && e.target.closest && e.target.closest('#play')) e.preventDefault();
});
const noTouchDefault = (e) => { if (e.cancelable) e.preventDefault(); };
cv.addEventListener('touchstart', noTouchDefault, { passive: false });
document.querySelectorAll('.dpad button').forEach(b => b.addEventListener('touchstart', noTouchDefault, { passive: false }));
// 手指離開畫面(或被系統中斷)時,一律放開觸控方向,避免角色卡住
const releaseTouch = () => {
  endSwipe();
  Game.held = Game.held.filter(k => !k.startsWith('Arrow'));
  try { const s = window.getSelection(); if (s && Game.g && s.rangeCount && !(document.activeElement && document.activeElement.tagName === 'INPUT')) s.removeAllRanges(); } catch (e) {}
};
window.addEventListener('pointerup', releaseTouch);
window.addEventListener('pointercancel', releaseTouch);
window.addEventListener('touchend', releaseTouch);
window.addEventListener('touchcancel', releaseTouch);

Online.init();
setInterval(() => Game.tick(), 50);
(function loop() { draw(); requestAnimationFrame(loop); })();
UI.renderMenu();
</script>
</body>
</html>
